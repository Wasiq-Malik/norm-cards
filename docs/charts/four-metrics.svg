<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-label="The same comparison under four metrics"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="14" y="42" font-size="12" fill="#12171F" font-weight="600">strict recall</text><text x="14" y="58" font-size="9.5" fill="#74828F">a reference experiment counts only when fully covered</text><line x1="210" y1="56" x2="730" y2="56" stroke="#E4E8EC"></line><circle cx="384.496644295302" cy="56" r="5.6" fill="#B3701F" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="384.496644295302" y="44" text-anchor="middle" font-size="10" fill="#41505F">0.797</text><text x="384.496644295302" y="72" text-anchor="middle" font-size="9" fill="#B3701F">no card</text><circle cx="411.2527964205817" cy="56" r="5.6" fill="#8C5A9E" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="432.496644295302" y="44" text-anchor="middle" font-size="10" fill="#41505F">0.804</text><text x="432.496644295302" y="72" text-anchor="middle" font-size="9" fill="#8C5A9E">retrieval</text><circle cx="555.5033557046979" cy="56" r="5.6" fill="#00899B" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="555.5033557046979" y="44" text-anchor="middle" font-size="10" fill="#41505F">0.842</text><text x="555.5033557046979" y="72" text-anchor="middle" font-size="9" fill="#00899B">norm card</text><text x="754" y="42" font-size="9.5" fill="#74828F" letter-spacing="1.1">CARD − NO CARD</text><text x="754" y="63" font-size="16" fill="#1E7A4B">+0.044 *</text><text x="842" y="63" font-size="9.5" fill="#74828F">[+0.018, +0.072]</text><line x1="14" y1="91" x2="926" y2="91" stroke="#ECEFF2"></line><text x="14" y="116" font-size="12" fill="#12171F" font-weight="600">recall</text><text x="14" y="132" font-size="9.5" fill="#74828F">a partly addressed experiment counts as a half</text><line x1="210" y1="130" x2="730" y2="130" stroke="#E4E8EC"></line><circle cx="411.0309278350516" cy="130" r="5.6" fill="#B3701F" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="411.0309278350516" y="118" text-anchor="middle" font-size="10" fill="#41505F">0.875</text><text x="411.0309278350516" y="146" text-anchor="middle" font-size="9" fill="#B3701F">no card</text><circle cx="432.02749140893445" cy="130" r="5.6" fill="#8C5A9E" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="459.0309278350516" y="118" text-anchor="middle" font-size="10" fill="#41505F">0.879</text><text x="459.0309278350516" y="146" text-anchor="middle" font-size="9" fill="#8C5A9E">retrieval</text><circle cx="528.9690721649483" cy="130" r="5.6" fill="#00899B" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="528.9690721649483" y="118" text-anchor="middle" font-size="10" fill="#41505F">0.901</text><text x="528.9690721649483" y="146" text-anchor="middle" font-size="9" fill="#00899B">norm card</text><text x="754" y="116" font-size="9.5" fill="#74828F" letter-spacing="1.1">CARD − NO CARD</text><text x="754" y="137" font-size="16" fill="#1E7A4B">+0.026 *</text><text x="842" y="137" font-size="9.5" fill="#74828F">[+0.010, +0.043]</text><line x1="14" y1="165" x2="926" y2="165" stroke="#ECEFF2"></line><text x="14" y="190" font-size="12" fill="#12171F" font-weight="600">rank-discounted recall</text><text x="14" y="206" font-size="9.5" fill="#74828F">later experiments count less, log₂ discount</text><line x1="210" y1="204" x2="730" y2="204" stroke="#E4E8EC"></line><circle cx="407.13563605728723" cy="204" r="5.6" fill="#8C5A9E" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="407.13563605728723" y="192" text-anchor="middle" font-size="10" fill="#41505F">0.654</text><text x="407.13563605728723" y="220" text-anchor="middle" font-size="9" fill="#8C5A9E">retrieval</text><circle cx="423.34456613310874" cy="204" r="5.6" fill="#B3701F" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="455.13563605728723" y="192" text-anchor="middle" font-size="10" fill="#41505F">0.657</text><text x="455.13563605728723" y="220" text-anchor="middle" fo