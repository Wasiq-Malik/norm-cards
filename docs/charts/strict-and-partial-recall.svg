<svg xmlns="http://www.w3.org/2000/svg" width="940" height="212" viewBox="0 0 940 212" role="img" aria-label="The same comparison under strict and partial-credit recall"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="14" y="42" font-size="12" fill="#12171F" font-weight="600">strict recall</text><text x="14" y="58" font-size="9.5" fill="#74828F">a reference experiment counts only when fully covered</text><line x1="210" y1="56" x2="730" y2="56" stroke="#E4E8EC"></line><circle cx="375.1376146788991" cy="56" r="5.6" fill="#B3701F" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="375.1376146788991" y="44" text-anchor="middle" font-size="10" fill="#41505F">0.711</text><text x="375.1376146788991" y="72" text-anchor="middle" font-size="9" fill="#B3701F">no card</text><circle cx="456.605504587156" cy="56" r="5.6" fill="#8C5A9E" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="456.605504587156" y="44" text-anchor="middle" font-size="10" fill="#41505F">0.733</text><text x="456.605504587156" y="72" text-anchor="middle" font-size="9" fill="#8C5A9E">retrieval</text><circle cx="564.8623853211009" cy="56" r="5.6" fill="#00899B" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="564.8623853211009" y="44" text-anchor="middle" font-size="10" fill="#41505F">0.762</text><text x="564.8623853211009" y="72" text-anchor="middle" font-size="9" fill="#00899B">norm card</text><text x="754" y="42" font-size="9.5" fill="#74828F" letter-spacing="1.1">CARD − NO CARD</text><text x="754" y="63" font-size="16" fill="#1E7A4B">+0.052 *</text><text x="842" y="63" font-size="9.5" fill="#74828F">[+0.020, +0.085]</text><line x1="14" y1="91" x2="926" y2="91" stroke="#ECEFF2"></line><text x="14" y="116" font-size="12" fill="#12171F" font-weight="600">recall</text><text x="14" y="132" font-size="9.5" fill="#74828F">a partly addressed experiment counts as a half</text><line x1="210" y1="130" x2="730" y2="130" stroke="#E4E8EC"></line><circle cx="404.675540765391" cy="130" r="5.6" fill="#B3701F" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="404.675540765391" y="118" text-anchor="middle" font-size="10" fill="#41505F">0.841</text><text x="404.675540765391" y="146" text-anchor="middle" font-size="9" fill="#B3701F">no card</text><circle cx="459.6173044925122" cy="130" r="5.6" fill="#8C5A9E" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="459.6173044925122" y="118" text-anchor="middle" font-size="10" fill="#41505F">0.854</text><text x="459.6173044925122" y="146" text-anchor="middle" font-size="9" fill="#8C5A9E">retrieval</text><circle cx="535.3244592346089" cy="130" r="5.6" fill="#00899B" stroke="#FFFFFF" stroke-width="1.6"></circle><text x="535.3244592346089" y="118" text-anchor="middle" font-size="10" fill="#41505F">0.872</text><text x="535.3244592346089" y="146" text-anchor="middle" font-size="9" fill="#00899B">norm card</text><text x="754" y="116" font-size="9.5" fill="#74828F" letter-spacing="1.1">CARD − NO CARD</text><text x="754" y="137" font-size="16" fill="#1E7A4B">+0.030 *</text><text x="842" y="137" font-size="9.5" fill="#74828F">[+0.012, +0.048]</text><text x="14" y="202" font-size="9.5" fill="#74828F">each row has its own scale — the metrics are not on a common footing · * interval excludes zero</text></svg>