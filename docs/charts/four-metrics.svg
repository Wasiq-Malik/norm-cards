.050 *</text><text x="842" y="285" font-size="9.5" fill="#74828F">[+0.016, +0.085]</text><text x="14" y="350" font-size="9.5" fill="#74828F">each row has its own scale — the metrics are not on a common footing · * interval excludes zero</text></svg>